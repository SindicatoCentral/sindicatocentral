<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Admin — Sindicato UCEN</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --gris-oscuro: #1E1E1E;
    --gris:        #2C2C2C;
    --gris-medio:  #4A4A4A;
    --gris-claro:  #F5F5F5;
    --borde:       #D8D8D8;
    --blanco:      #FFFFFF;
    --acento:      #4A4A4A;
    --acento-hover:#2C2C2C;
    --rojo:        #C0242D;
    --verde:       #2E7D32;
  }
  body { font-family: 'Inter', sans-serif; background: var(--gris-claro); color: var(--gris); min-height: 100vh; }

  /* LOGIN */
  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--gris-oscuro); }
  .login-box { background: var(--blanco); border-radius: 4px; padding: 3rem 2.5rem; width: 100%; max-width: 420px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
  .login-logo { text-align: center; margin-bottom: 2rem; }
  .login-logo h1 { font-family: 'Playfair Display', serif; font-size: 1.4rem; color: var(--gris-oscuro); }
  .login-logo p { font-size: 0.82rem; color: #888; margin-top: 0.3rem; }
  .form-group { margin-bottom: 1.2rem; }
  .form-group label { display: block; font-size: 0.78rem; font-weight: 600; color: var(--gris-medio); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 0.4rem; }
  .form-group input, .form-group textarea { width: 100%; padding: 0.75rem 1rem; border: 1.5px solid var(--borde); border-radius: 2px; font-family: 'Inter', sans-serif; font-size: 0.95rem; color: var(--gris-oscuro); outline: none; transition: border-color 0.2s; }
  .form-group input:focus, .form-group textarea:focus { border-color: var(--acento); }
  .form-group textarea { resize: vertical; min-height: 180px; }
  .btn-login { width: 100%; padding: 0.85rem; background: var(--acento); color: var(--blanco); border: none; border-radius: 2px; cursor: pointer; font-family: 'Inter', sans-serif; font-size: 0.9rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; transition: background 0.2s; margin-top: 0.5rem; }
  .btn-login:hover { background: var(--acento-hover); }
  .login-error { background: #fff3f3; border: 1px solid #e06068; color: var(--rojo); padding: 0.75rem 1rem; border-radius: 2px; font-size: 0.85rem; margin-top: 1rem; display: none; }

  /* PANEL */
  .panel-wrap { display: none; }
  .topbar { background: var(--gris-oscuro); display: flex; align-items: center; justify-content: space-between; padding: 0 2rem; height: 60px; border-bottom: 2px solid var(--acento); position: sticky; top: 0; z-index: 100; }
  .topbar-title { font-family: 'Playfair Display', serif; font-size: 1.1rem; color: var(--blanco); }
  .topbar-right { display: flex; align-items: center; gap: 1rem; }
  .topbar-user { font-size: 0.82rem; color: #aaa; }
  .btn-topbar { background: none; border: 1px solid #555; color: #ccc; padding: 0.4rem 1rem; border-radius: 2px; cursor: pointer; font-size: 0.78rem; font-family: 'Inter', sans-serif; letter-spacing: 0.06em; text-transform: uppercase; transition: all 0.2s; text-decoration: none; display: inline-block; }
  .btn-topbar:hover { border-color: #aaa; color: var(--blanco); }

  .panel-content { max-width: 1000px; margin: 0 auto; padding: 2.5rem 2rem; }

  /* HEADER SECCIÓN */
  .seccion-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
  .seccion-header h2 { font-family: 'Playfair Display', serif; font-size: 1.4rem; color: var(--gris-oscuro); }
  .btn-nuevo { background: var(--acento); color: var(--blanco); padding: 0.65rem 1.5rem; border: none; border-radius: 2px; cursor: pointer; font-family: 'Inter', sans-serif; font-size: 0.82rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; transition: background 0.2s; }
  .btn-nuevo:hover { background: var(--acento-hover); }

  /* FORMULARIO */
  .form-noticia { background: var(--blanco); border-radius: 2px; padding: 2rem; border: 1px solid var(--borde); margin-bottom: 2rem; display: none; }
  .form-noticia.visible { display: block; }
  .form-noticia h3 { font-family: 'Playfair Display', serif; font-size: 1.1rem; color: var(--gris-oscuro); margin-bottom: 1.5rem; padding-bottom: 0.8rem; border-bottom: 1px solid var(--borde); }
  .form-acciones { display: flex; gap: 1rem; margin-top: 0.5rem; }
  .btn-guardar { background: var(--acento); color: var(--blanco); padding: 0.7rem 1.8rem; border: none; border-radius: 2px; cursor: pointer; font-family: 'Inter', sans-serif; font-size: 0.85rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; transition: background 0.2s; }
  .btn-guardar:hover { background: var(--acento-hover); }
  .btn-cancelar { background: none; border: 1.5px solid var(--borde); color: var(--gris-medio); padding: 0.7rem 1.8rem; border-radius: 2px; cursor: pointer; font-family: 'Inter', sans-serif; font-size: 0.85rem; transition: all 0.2s; }
  .btn-cancelar:hover { border-color: var(--gris-medio); }

  /* LISTA */
  .noticias-lista { display: flex; flex-direction: column; gap: 1rem; }
  .noticia-item { background: var(--blanco); border-radius: 2px; border: 1px solid var(--borde); padding: 1.5rem; display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; transition: box-shadow 0.2s; }
  .noticia-item:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
  .noticia-info { flex: 1; }
  .noticia-titulo { font-family: 'Playfair Display', serif; font-size: 1rem; color: var(--gris-oscuro); margin-bottom: 0.4rem; }
  .noticia-resumen { font-size: 0.85rem; color: #666; line-height: 1.5; }
  .noticia-acciones { display: flex; gap: 0.5rem; flex-shrink: 0; }
  .btn-editar { background: none; border: 1px solid var(--borde); color: var(--gris-medio); padding: 0.4rem 0.9rem; border-radius: 2px; cursor: pointer; font-size: 0.78rem; font-family: 'Inter', sans-serif; transition: all 0.2s; }
  .btn-editar:hover { border-color: var(--acento); color: var(--acento); }
  .btn-eliminar { background: none; border: 1px solid #ffcccc; color: var(--rojo); padding: 0.4rem 0.9rem; border-radius: 2px; cursor: pointer; font-size: 0.78rem; font-family: 'Inter', sans-serif; transition: all 0.2s; }
  .btn-eliminar:hover { background: #fff3f3; }

  /* TOAST */
  .toast { position: fixed; bottom: 2rem; right: 2rem; padding: 1rem 1.5rem; border-radius: 2px; font-size: 0.88rem; font-weight: 500; box-shadow: 0 4px 16px rgba(0,0,0,0.15); display: none; z-index: 999; }
  .toast.exito { background: #f0fff4; border: 1px solid #4caf50; color: var(--verde); }
  .toast.error { background: #fff3f3; border: 1px solid #e06068; color: var(--rojo); }

  /* VACÍO / LOADING */
  .vacio { text-align: center; padding: 4rem 2rem; background: var(--blanco); border: 1px dashed var(--borde); border-radius: 2px; }
  .vacio-icon { font-size: 3rem; margin-bottom: 1rem; }
  .vacio p { color: #888; font-size: 0.92rem; }
  .loading { text-align: center; padding: 3rem; color: #888; font-size: 0.9rem; }

  @media (max-width: 600px) {
    .panel-content { padding: 1.5rem 1rem; }
    .topbar { padding: 0 1rem; }
    .topbar-title { font-size: 0.9rem; }
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="loginWrap">
  <div class="login-box">
    <div class="login-logo">
      <h1>Panel Administrador</h1>
      <p>Sindicato de Trabajadores UCEN</p>
    </div>
    <div class="form-group">
      <label>Correo electrónico</label>
      <input type="email" id="loginEmail" placeholder="correo@ejemplo.cl">
    </div>
    <div class="form-group">
      <label>Contraseña</label>
      <input type="password" id="loginPassword" placeholder="••••••••" onkeydown="if(event.key==='Enter') iniciarSesion()">
    </div>
    <button class="btn-login" onclick="iniciarSesion()">Ingresar</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- PANEL -->
<div class="panel-wrap" id="panelWrap">
  <div class="topbar">
    <span class="topbar-title">Panel Administrador — Sindicato UCEN</span>
    <div class="topbar-right">
      <span class="topbar-user" id="topbarUser"></span>
      <a href="index.html" class="btn-topbar">← Ir al sitio</a>
      <button class="btn-topbar" onclick="cerrarSesion()">Cerrar sesión</button>
    </div>
  </div>

  <div class="panel-content">
    <div class="seccion-header">
      <h2>Noticias y comunicados</h2>
      <button class="btn-nuevo" onclick="mostrarFormulario()">+ Nueva noticia</button>
    </div>

    <!-- Formulario -->
    <div class="form-noticia" id="formNoticia">
      <h3 id="formTitulo">Nueva noticia</h3>
      <input type="hidden" id="noticiaId">
      <div class="form-group">
        <label>Título</label>
        <input type="text" id="nTitulo" placeholder="Título de la noticia o comunicado">
      </div>
      <div class="form-group">
        <label>Contenido</label>
        <textarea id="nContenido" placeholder="Escribe aquí el contenido completo..."></textarea>
      </div>
      <div class="form-acciones">
        <button class="btn-guardar" onclick="guardarNoticia()">Guardar noticia</button>
        <button class="btn-cancelar" onclick="ocultarFormulario()">Cancelar</button>
      </div>
    </div>

    <!-- Lista -->
    <div class="noticias-lista" id="noticiasList">
      <div class="loading">Cargando noticias...</div>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, serverTimestamp, query, orderBy }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC8piyFY_dr0FQ-SCN6C_9zGtlppaJVtPQ",
    authDomain: "sindicato-ucen.firebaseapp.com",
    projectId: "sindicato-ucen",
    storageBucket: "sindicato-ucen.firebasestorage.app",
    messagingSenderId: "845293926331",
    appId: "1:845293926331:web:b462a0c3c891c32fb0b69e"
  };

  const app  = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db   = getFirestore(app);

  // AUTH STATE
  onAuthStateChanged(auth, user => {
    if (user) {
      document.getElementById('loginWrap').style.display = 'none';
      document.getElementById('panelWrap').style.display = 'block';
      document.getElementById('topbarUser').textContent = user.email;
      limpiarLogin();
      cargarNoticias();
    } else {
      document.getElementById('loginWrap').style.display = 'flex';
      document.getElementById('panelWrap').style.display = 'none';
    }
  });

  function limpiarLogin() {
    document.getElementById('loginEmail').value = '';
    document.getElementById('loginPassword').value = '';
    document.getElementById('loginError').style.display = 'none';
  }

  // LOGIN
  window.iniciarSesion = async () => {
    const email    = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const errDiv   = document.getElementById('loginError');
    errDiv.style.display = 'none';
    try {
      await signInWithEmailAndPassword(auth, email, password);
    } catch(e) {
      errDiv.style.display = 'block';
      errDiv.textContent = 'Correo o contraseña incorrectos.';
    }
  };

  // LOGOUT
  window.cerrarSesion = async () => {
    await signOut(auth);
    limpiarLogin();
    window.location.href = 'index.html';
  };

  // FORMULARIO
  window.mostrarFormulario = () => {
    document.getElementById('formNoticia').classList.add('visible');
    document.getElementById('formTitulo').textContent = 'Nueva noticia';
    document.getElementById('noticiaId').value = '';
    document.getElementById('nTitulo').value = '';
    document.getElementById('nContenido').value = '';
  };

  window.ocultarFormulario = () => {
    document.getElementById('formNoticia').classList.remove('visible');
  };

  // CARGAR NOTICIAS
  async function cargarNoticias() {
    const lista = document.getElementById('noticiasList');
    lista.innerHTML = '<div class="loading">Cargando noticias...</div>';
    try {
      const q = query(collection(db, 'noticias'), orderBy('createdAt', 'desc'));
      const snap = await getDocs(q);
      if (snap.empty) {
        lista.innerHTML = '<div class="vacio"><div class="vacio-icon">📰</div><p>No hay noticias publicadas aún.<br>Haz clic en "Nueva noticia" para agregar la primera.</p></div>';
        return;
      }
      lista.innerHTML = '';
      snap.forEach(d => {
        const n = d.data();
        const item = document.createElement('div');
        item.className = 'noticia-item';
        item.dataset.id       = d.id;
        item.dataset.titulo   = n.titulo   || '';
        item.dataset.contenido= n.contenido|| '';
        const resumen = (n.contenido || '').substring(0, 120) + ((n.contenido || '').length > 120 ? '...' : '');
        item.innerHTML =
          '<div class="noticia-info">' +
            '<div class="noticia-titulo">' + (n.titulo || '') + '</div>' +
            '<div class="noticia-resumen">' + resumen + '</div>' +
          '</div>' +
          '<div class="noticia-acciones">' +
            '<button class="btn-editar">Editar</button>' +
            '<button class="btn-eliminar">Eliminar</button>' +
          '</div>';
        item.querySelector('.btn-editar').addEventListener('click', () => {
          editarNoticia(item.dataset.id, item.dataset.titulo, item.dataset.contenido);
        });
        item.querySelector('.btn-eliminar').addEventListener('click', () => {
          eliminarNoticia(item.dataset.id);
        });
        lista.appendChild(item);
      });
    } catch(e) {
      console.error('Error:', e);
      lista.innerHTML = '<div class="loading">Error al cargar: ' + e.message + '</div>';
    }
  }

  // GUARDAR
  window.guardarNoticia = async () => {
    const id       = document.getElementById('noticiaId').value;
    const titulo   = document.getElementById('nTitulo').value.trim();
    const contenido= document.getElementById('nContenido').value.trim();
    if (!titulo || !contenido) {
      mostrarToast('Completa el título y el contenido.', 'error'); return;
    }
    try {
      if (id) {
        await updateDoc(doc(db, 'noticias', id), { titulo, contenido });
        mostrarToast('Noticia actualizada correctamente.', 'exito');
      } else {
        await addDoc(collection(db, 'noticias'), { titulo, contenido, createdAt: serverTimestamp() });
        mostrarToast('Noticia publicada correctamente.', 'exito');
      }
      ocultarFormulario();
      cargarNoticias();
    } catch(e) {
      mostrarToast('Error al guardar: ' + e.message, 'error');
    }
  };

  // EDITAR
  function editarNoticia(id, titulo, contenido) {
    document.getElementById('formNoticia').classList.add('visible');
    document.getElementById('formTitulo').textContent = 'Editar noticia';
    document.getElementById('noticiaId').value  = id;
    document.getElementById('nTitulo').value    = titulo;
    document.getElementById('nContenido').value = contenido;
    document.getElementById('formNoticia').scrollIntoView({ behavior: 'smooth' });
  }

  // ELIMINAR
  window.eliminarNoticia = async (id) => {
    if (!confirm('¿Estás seguro de eliminar esta noticia?')) return;
    try {
      await deleteDoc(doc(db, 'noticias', id));
      mostrarToast('Noticia eliminada.', 'exito');
      cargarNoticias();
    } catch(e) {
      mostrarToast('Error al eliminar: ' + e.message, 'error');
    }
  };

  // TOAST
  function mostrarToast(msg, tipo) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast ' + tipo;
    t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 3500);
  }
</script>

</body>
</html>
